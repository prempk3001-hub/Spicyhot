<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SpiceHot Login</title>
    <meta name="description" content="Login to your SpiceHot account to manage orders and favourites.">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <link rel="stylesheet" href="style.css">
    <style>
        body {
            background: linear-gradient(135deg, #f8f4f1 0%, #f1e7df 100%);
        }

        .auth-shell {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem 1rem;
        }

        .auth-card {
            width: min(100%, 440px);
            background: rgba(255, 255, 255, 0.96);
            border: 1px solid rgba(43, 26, 18, 0.08);
            border-radius: 28px;
            box-shadow: 0 25px 60px rgba(43, 26, 18, 0.12);
            overflow: hidden;
        }

        .auth-top {
            padding: 2rem 2rem 1rem;
            text-align: center;
            background: linear-gradient(180deg, rgba(255, 69, 0, 0.07), rgba(255, 255, 255, 0.2));
        }

        .auth-brand {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 72px;
            height: 72px;
            margin-bottom: 0.75rem;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--brand-primary) 0%, #de5f1d 100%);
            color: #fff;
            font-size: 1.7rem;
            box-shadow: 0 15px 30px rgba(255, 69, 0, 0.22);
        }

        .auth-top h1 {
            margin: 0;
            font-size: clamp(1.7rem, 2.5vw, 2.4rem);
            font-weight: 800;
            color: var(--brand-secondary);
        }

        .auth-top p {
            margin: 0.5rem 0 0;
            color: var(--brand-text-muted);
            font-size: 0.96rem;
        }

        .auth-form {
            padding: 1.75rem 2rem 2rem;
        }

        .auth-field {
            position: relative;
            margin-bottom: 1rem;
        }

        .auth-field i {
            position: absolute;
            top: 50%;
            left: 1rem;
            transform: translateY(-50%);
            color: var(--brand-primary);
            font-size: 0.95rem;
        }

        .auth-field input {
            width: 100%;
            height: 52px;
            padding: 0.75rem 1rem 0.75rem 2.8rem;
            border: 1px solid rgba(43, 26, 18, 0.12);
            border-radius: 14px;
            background: #fff;
            color: var(--brand-text);
            outline: none;
            transition: border-color 0.2s ease, box-shadow 0.2s ease;
        }

        .auth-field input:focus {
            border-color: rgba(255, 69, 0, 0.7);
            box-shadow: 0 0 0 0.2rem rgba(255, 69, 0, 0.12);
        }

        .auth-options {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 0.75rem;
            margin: 0.4rem 0 1.3rem;
            font-size: 0.9rem;
        }

        .auth-options label {
            display: inline-flex;
            align-items: center;
            gap: 0.45rem;
            color: var(--brand-text-muted);
        }

        .auth-options a {
            color: var(--brand-primary);
            text-decoration: none;
            font-weight: 600;
        }

        .auth-options a:hover {
            text-decoration: underline;
        }

        .auth-submit {
            width: 100%;
            height: 50px;
            border: 0;
            border-radius: 14px;
            background: linear-gradient(135deg, var(--brand-primary) 0%, #de5f1d 100%);
            color: #fff;
            font-weight: 700;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }

        .auth-submit:hover,
        .auth-submit:focus {
            color: #fff;
            transform: translateY(-1px);
            box-shadow: 0 14px 24px rgba(255, 69, 0, 0.25);
        }

        .auth-divider {
            display: flex;
            align-items: center;
            gap: 0.85rem;
            margin: 1.5rem 0 1rem;
            color: var(--brand-text-muted);
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 0.08em;
        }

        .auth-divider::before,
        .auth-divider::after {
            content: "";
            flex: 1;
            height: 1px;
            background: rgba(43, 26, 18, 0.12);
        }

        .auth-google {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            height: 48px;
            border: 1px solid rgba(43, 26, 18, 0.12);
            border-radius: 14px;
            background: #fff;
            color: var(--brand-secondary);
            font-weight: 600;
            text-decoration: none;
        }

        .auth-google i {
            margin-right: 0.6rem;
            color: #db4437;
        }

        .auth-google:hover,
        .auth-google:focus {
            color: var(--brand-secondary);
            text-decoration: none;
            border-color: rgba(43, 26, 18, 0.2);
        }

        .auth-footer {
            margin-top: 1.15rem;
            text-align: center;
            color: var(--brand-text-muted);
            font-size: 0.92rem;
        }

        .auth-footer a {
            color: var(--brand-primary);
            font-weight: 700;
            text-decoration: none;
        }

        .auth-footer a:hover {
            text-decoration: underline;
        }

        @media (max-width: 480px) {
            .auth-card {
                border-radius: 22px;
            }

            .auth-top,
            .auth-form {
                padding-left: 1.25rem;
                padding-right: 1.25rem;
            }
        }
    </style>
</head>

<body>
    <div class="auth-shell">
        <div class="auth-card">
            <div class="auth-top">
                <div class="auth-brand">
                    <i class="fa-solid fa-utensils" aria-hidden="true"></i>
                </div>
                <h1>Welcome Back</h1>
                <p>Login to your SpiceHot account</p>
            </div>

            <form class="auth-form" id="loginForm" novalidate>
                <div class="auth-field">
                    <i class="fa-solid fa-envelope" aria-hidden="true"></i>
                    <input type="text" id="loginId" name="loginId" placeholder="Email or User ID" aria-label="Email or user ID" required>
                </div>

                <div class="auth-field">
                    <i class="fa-solid fa-lock" aria-hidden="true"></i>
                    <input type="password" id="password" name="password" placeholder="Password" aria-label="Password" required>
                </div>

                <div class="auth-options">
                    <label>
                        <input type="checkbox" name="remember">
                        Remember me
                    </label>
                    <a href="#">Forgot password?</a>
                </div>

                <div class="auth-message" hidden></div>

                <button type="submit" class="auth-submit">Login</button>

                <div class="auth-divider">or</div>

                <a href="#" class="auth-google" aria-label="Continue with Google">
                    <i class="fa-brands fa-google" aria-hidden="true"></i>
                    Continue with Google
                </a>

                <div class="auth-footer">
                    Don’t have an account? <a href="signup.html">Create one</a>
                </div>
            </form>
        </div>
    </div>

    <script src="auth.js"></script>
</body>

</html>
